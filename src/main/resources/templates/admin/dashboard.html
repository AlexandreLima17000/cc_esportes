<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin | C&C Esportes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen">

<!-- Topbar Admin com Logo C&C ESPORTE -->
<header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur px-8 py-3 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-4">
        <!-- Logo C&C Esporte -->
        <div class="flex items-center gap-3">
            <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="C&C ESPORTE" class="h-12 w-auto object-contain drop-shadow-md">
            <div>
                <div class="flex items-center gap-2">
                    <span class="bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">ADMIN</span>
                    <h1 class="text-lg font-black tracking-wider text-slate-100 uppercase">Painel de Gestão</h1>
                </div>
                <p class="text-xs text-slate-400 font-medium">Controle do Catálogo de Mantos</p>
            </div>
        </div>
    </div>

    <a href="/" target="_blank" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-lg shadow-amber-500/10 flex items-center gap-2">
        <i class="fa-solid fa-store"></i> Ver Loja On-line
    </a>
</header>

<main class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- COLUNA ESQUERDA: Formulários -->
    <div class="space-y-8">

        <!-- 1. Cadastrar Novo Manto -->
        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-black text-amber-500 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-shirt"></i> Cadastrar Manto
            </h2>

            <form th:action="@{/admin/produtos/salvar}"
                  th:object="${novoProduto}"
                  method="post"
                  enctype="multipart/form-data"
                  class="space-y-4">

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nome da Camisa</label>
                    <input type="text" th:field="*{nome}" placeholder="Ex: Camisa São Paulo I 2026/27" required
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 outline-none text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Preço (R$)</label>
                        <input type="number" step="0.01" th:field="*{precoAPartir}" placeholder="149.90" required
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 focus:border-amber-500 outline-none text-sm">
                    </div>

                    <!-- Modelo / Versão -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Modelo / Versão</label>
                        <select th:field="*{modelo}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 text-sm focus:border-amber-500 outline-none" required>
                            <option value="Torcedor">Torcedor</option>
                            <option value="Jogador">Jogador</option>
                            <option value="Retrô">Retrô</option>
                        </select>
                    </div>
                </div>

                <!-- Upload do Computador -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Imagem do Manto (Upload do Computador)</label>
                    <input type="file" name="fileImagem" accept="image/*" required
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-300 text-xs focus:border-amber-500 outline-none file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Categoria Principal -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Categoria</label>
                        <select id="selectCategoria" th:field="*{categoria.id}" onchange="atualizarTemporadasETimes()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 text-sm focus:border-amber-500 outline-none" required>
                            <option value="">Selecione...</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}" th:data-nome="${cat.nome}"></option>
                        </select>
                    </div>

                    <!-- Equipe / Time Organizado por Ligas -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Equipe / Time</label>
                        <select id="selectTime" th:field="*{time.id}" onchange="verificarOpcaoOutros()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 text-sm focus:border-amber-500 outline-none" required>
                            <option value="">Selecione...</option>
                            <optgroup th:each="liga : ${ligas}" th:label="${liga.nome}" th:data-categoria-id="${liga.categoriaPrincipal != null ? liga.categoriaPrincipal.id : ''}">
                                <option th:each="t : ${times}"
                                        th:if="${t.liga != null && t.liga.id == liga.id}"
                                        th:value="${t.id}"
                                        th:text="${t.nome}"
                                        th:data-is-outros="${t.nome.startsWith('Outros')}">
                                </option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <!-- Temporada Dinâmica -->
                <div id="boxTemporada">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Temporada</label>
                    <select id="selectTemporada" name="temporada" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 text-sm focus:border-amber-500 outline-none">
                        <option value="">Selecione a Temporada...</option>
                    </select>
                </div>

                <!-- Selo / Destaque -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Selo / Destaque</label>
                    <select th:field="*{selo.id}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 text-sm focus:border-amber-500 outline-none">
                        <option value="">Sem Selo</option>
                        <option th:each="s : ${selos}" th:value="${s.id}" th:text="${s.nome}"></option>
                    </select>
                </div>

                <!-- Campo extra dinâmico para a opção OUTROS -->
                <div id="boxCamposOutros" class="hidden bg-slate-950 p-4 rounded-xl border border-amber-500/30 space-y-3">
                    <p class="text-xs text-amber-400 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-circle-info"></i> Especifique a Liga e Time Personalizados:
                    </p>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Liga / Campeonato</label>
                            <input type="text" name="ligaPersonalizada" placeholder="Ex: Eredivisie (Holanda)"
                                   class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:border-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Time / Seleção</label>
                            <input type="text" name="timePersonalizado" placeholder="Ex: Ajax"
                                   class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-100 focus:border-amber-500 outline-none">
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-3 rounded-xl transition mt-2 shadow-lg shadow-amber-500/10">
                    <i class="fa-solid fa-plus"></i> Salvar Manto
                </button>
            </form>
        </div>

        <!-- 2. Cadastrar Categoria e Time Rápido -->
        <div class="space-y-4">
            <!-- Nova Categoria -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h3 class="text-sm font-bold text-amber-500 uppercase mb-3"><i class="fa-solid fa-tags"></i> Nova Categoria</h3>
                <form th:action="@{/admin/categorias/salvar}" th:object="${novaCategoria}" method="post" class="flex gap-2">
                    <input type="text" th:field="*{nome}" placeholder="Ex: Retrô 90s" required
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:border-amber-500 outline-none">
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">OK</button>
                </form>
            </div>

            <!-- Novo Time -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
                <h3 class="text-sm font-bold text-amber-500 uppercase mb-3"><i class="fa-solid fa-shield-halved"></i> Novo Time / Equipe</h3>
                <form th:action="@{/admin/times/salvar}" th:object="${novoTime}" method="post" class="space-y-3">
                    <input type="text" th:field="*{nome}" placeholder="Nome do Time (ex: Borussia Dortmund)" required
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:border-amber-500 outline-none">

                    <div class="flex gap-2">
                        <select th:field="*{liga.id}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:border-amber-500 outline-none" required>
                            <option value="">Selecione a Liga...</option>
                            <option th:each="liga : ${ligas}" th:value="${liga.id}" th:text="${liga.nome}"></option>
                        </select>
                        <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs">OK</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- COLUNA DIREITA: Tabela de Mantos Cadastrados -->
    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
        <div>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-black text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-list text-amber-500"></i> Mantos no Catálogo
                </h2>
                <span th:text="${produtos.size() + ' Cadastrados'}" class="text-xs bg-slate-800 text-amber-400 px-3 py-1 rounded-full font-bold"></span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800">
                    <tr>
                        <th class="p-3">Imagem</th>
                        <th class="p-3">Produto</th>
                        <th class="p-3">Modelo</th>
                        <th class="p-3">Categoria</th>
                        <th class="p-3">Temporada</th>
                        <th class="p-3">Preço</th>
                        <th class="p-3 text-right">Ações</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60">
                    <tr th:each="prod : ${produtos}" class="hover:bg-slate-800/40 transition">
                        <td class="p-3">
                            <img th:src="@{${prod.imagemUrl}}" alt="Foto" class="w-12 h-12 object-cover rounded-lg border border-slate-800">
                        </td>
                        <td class="p-3">
                            <p class="font-bold text-slate-100" th:text="${prod.nome}"></p>
                            <span th:text="${prod.qualidade}" class="text-[10px] text-amber-500"></span>
                        </td>
                        <td class="p-3">
                            <span th:text="${prod.modelo != null ? prod.modelo : 'Torcedor'}" class="bg-amber-500/10 text-amber-400 text-[11px] font-semibold px-2 py-0.5 rounded border border-amber-500/20"></span>
                        </td>
                        <td class="p-3">
                            <span th:text="${prod.categoria != null ? prod.categoria.nome : 'Sem Categoria'}" class="bg-slate-800 text-slate-300 text-[11px] font-semibold px-2 py-0.5 rounded"></span>
                        </td>
                        <td class="p-3">
                            <span th:text="${prod.temporada != null ? prod.temporada : '-'}" class="bg-slate-800 text-amber-400 text-xs font-bold px-2 py-1 rounded-md"></span>
                        </td>
                        <td class="p-3 font-bold text-amber-400" th:text="${'R$ ' + #numbers.formatDecimal(prod.precoAPartir, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td class="p-3 text-right space-x-1">
                            <!-- Botão Editar (Abre o Modal Pop-up) -->
                            <button type="button"
                                    th:data-id="${prod.id}"
                                    th:data-nome="${prod.nome}"
                                    th:data-preco="${prod.precoAPartir}"
                                    th:data-modelo="${prod.modelo}"
                                    th:data-categoria="${prod.categoria != null ? prod.categoria.id : ''}"
                                    th:data-time="${prod.time != null ? prod.time.id : ''}"
                                    th:data-temporada="${prod.temporada}"
                                    th:data-selo="${prod.selo != null ? prod.selo.id : ''}"
                                    onclick="abrirModalEdicao(this)"
                                    class="bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 p-2 rounded-lg transition inline-block">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <!-- Botão Excluir -->
                            <a th:href="@{'/admin/produtos/excluir/' + ${prod.id}}"
                               onclick="return confirm('Tem certeza que deseja excluir esta camisa?');"
                               class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white p-2 rounded-lg transition inline-block">
                                <i class="fa-solid fa-trash-can"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="7" class="text-center py-8 text-slate-500">Nenhum manto cadastrado no banco.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</main>

<!-- MODAL POPUP DE EDIÇÃO -->
<div id="modalEdicao" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">

        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
            <h3 class="text-lg font-black text-amber-500 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square"></i> Editar Manto
            </h3>
            <button type="button" onclick="fecharModalEdicao()" class="text-slate-400 hover:text-slate-100 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form th:action="@{/admin/produtos/salvar}" method="post" enctype="multipart/form-data" class="space-y-4">

            <input type="hidden" id="editId" name="id" />

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Nome da Camisa</label>
                <input type="text" id="editNome" name="nome" required
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-100 focus:border-amber-500 outline-none text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Preço (R$)</label>
                    <input type="number" step="0.01" id="editPreco" name="precoAPartir" required
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-slate-100 focus:border-amber-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Modelo / Versão</label>
                    <select id="editModelo" name="modelo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:border-amber-500 outline-none" required>
                        <option value="Torcedor">Torcedor</option>
                        <option value="Jogador">Jogador</option>
                        <option value="Retrô">Retrô</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Trocar Imagem (Opcional)</label>
                <input type="file" name="fileImagem" accept="image/*"
                       class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-slate-300 text-xs focus:border-amber-500 outline-none file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Categoria Principal do Modal -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Categoria</label>
                    <select id="editCategoria" name="categoria.id" onchange="atualizarTemporadasETimesEdit()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:border-amber-500 outline-none" required>
                        <option value="">Selecione...</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nome}" th:data-nome="${cat.nome}"></option>
                    </select>
                </div>

                <!-- Equipe / Time Agrupado por Ligas no Modal -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Equipe / Time</label>
                    <select id="editTime" name="time.id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:border-amber-500 outline-none" required>
                        <option value="">Selecione...</option>
                        <optgroup th:each="liga : ${ligas}" th:label="${liga.nome}" th:data-categoria-id="${liga.categoriaPrincipal != null ? liga.categoriaPrincipal.id : ''}">
                            <option th:each="t : ${times}"
                                    th:if="${t.liga != null && t.liga.id == liga.id}"
                                    th:value="${t.id}"
                                    th:text="${t.nome}">
                            </option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Temporada em Dropdown Dinâmico no Modal -->
                <div id="boxTemporadaEdit">
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Temporada</label>
                    <select id="editTemporada" name="temporada" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:border-amber-500 outline-none">
                        <option value="">Selecione a Temporada...</option>
                    </select>
                </div>

                <!-- Selo / Destaque no Modal -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Selo / Destaque</label>
                    <select id="editSelo" name="selo.id" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:border-amber-500 outline-none">
                        <option value="">Sem Selo</option>
                        <option th:each="s : ${selos}" th:value="${s.id}" th:text="${s.nome}"></option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 pt-3 border-t border-slate-800">
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-2.5 rounded-xl transition">
                    Salvar Alterações
                </button>
                <button type="button" onclick="fecharModalEdicao()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2.5 rounded-xl text-xs">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Scripts JavaScript -->
<script>
    function atualizarTemporadasETimes() {
        const selectCategoria = document.getElementById('selectCategoria');
        const optionSelecionada = selectCategoria.options[selectCategoria.selectedIndex];
        const nomeCategoria = optionSelecionada ? optionSelecionada.getAttribute('data-nome') : '';
        const categoriaId = selectCategoria.value;

        const boxTemporada = document.getElementById('boxTemporada');
        const selectTemporada = document.getElementById('selectTemporada');
        const selectTime = document.getElementById('selectTime');

        // Filtrar ligas e times pela categoria
        const optgroups = selectTime.getElementsByTagName('optgroup');
        for (let group of optgroups) {
            const groupCategoriaId = group.getAttribute('data-categoria-id');
            if (!categoriaId || groupCategoriaId === categoriaId) {
                group.style.display = '';
            } else {
                group.style.display = 'none';
            }
        }
        selectTime.value = '';

        // Popula as opções de Temporada
        selectTemporada.innerHTML = '<option value="">Selecione a Temporada...</option>';

        if (!nomeCategoria || nomeCategoria.toLowerCase() === 'retrô' || nomeCategoria.toLowerCase() === 'retro') {
            boxTemporada.classList.add('hidden');
        } else {
            boxTemporada.classList.remove('hidden');

            let opcoes = (nomeCategoria.toLowerCase() === 'nacionais')
                ? ['2022', '2023', '2024', '2025', '2026', '2027','2028', '2029','2030']
                : ['2022/23', '2023/24', '2024/25', '2025/26', '2026/27','2027/28','2028/29','2029/30','2030/31'];

            opcoes.forEach(temp => {
                const opt = document.createElement('option');
                opt.value = temp;
                opt.textContent = temp;
                selectTemporada.appendChild(opt);
            });
        }
        verificarOpcaoOutros();
    }

    function atualizarTemporadasETimesEdit(valTemporadaAtual) {
        const selectCategoria = document.getElementById('editCategoria');
        const optionSelecionada = selectCategoria.options[selectCategoria.selectedIndex];
        const nomeCategoria = optionSelecionada ? optionSelecionada.getAttribute('data-nome') : '';
        const categoriaId = selectCategoria.value;

        const boxTemporada = document.getElementById('boxTemporadaEdit');
        const selectTemporada = document.getElementById('editTemporada');
        const selectTime = document.getElementById('editTime');

        // Filtrar ligas e times no modal
        const optgroups = selectTime.getElementsByTagName('optgroup');
        for (let group of optgroups) {
            const groupCategoriaId = group.getAttribute('data-categoria-id');
            if (!categoriaId || groupCategoriaId === categoriaId) {
                group.style.display = '';
            } else {
                group.style.display = 'none';
            }
        }

        // Popula opções de Temporada no modal
        selectTemporada.innerHTML = '<option value="">Selecione a Temporada...</option>';

        if (!nomeCategoria || nomeCategoria.toLowerCase() === 'retrô' || nomeCategoria.toLowerCase() === 'retro') {
            boxTemporada.classList.add('hidden');
        } else {
            boxTemporada.classList.remove('hidden');

            let opcoes = (nomeCategoria.toLowerCase() === 'nacionais')
                ? ['2022', '2023', '2024', '2025', '2026', '2027','2028','2029','2030']
                : ['2022/23', '2023/24', '2024/25', '2025/26', '2026/27','2027/28', '2028/29', '2029/30', '2030/31'];

            opcoes.forEach(temp => {
                const opt = document.createElement('option');
                opt.value = temp;
                opt.textContent = temp;
                if (valTemporadaAtual && valTemporadaAtual === temp) {
                    opt.selected = true;
                }
                selectTemporada.appendChild(opt);
            });
        }
    }

    function verificarOpcaoOutros() {
        const selectTime = document.getElementById('selectTime');
        const optionSelecionada = selectTime.options[selectTime.selectedIndex];
        const boxOutros = document.getElementById('boxCamposOutros');

        if (optionSelecionada && optionSelecionada.getAttribute('data-is-outros') === 'true') {
            boxOutros.classList.remove('hidden');
        } else {
            boxOutros.classList.add('hidden');
        }
    }

    function abrirModalEdicao(btn) {
        const id = btn.getAttribute('data-id');
        const nome = btn.getAttribute('data-nome');
        const preco = btn.getAttribute('data-preco');
        const modelo = btn.getAttribute('data-modelo') || 'Torcedor';
        const categoria = btn.getAttribute('data-categoria');
        const time = btn.getAttribute('data-time');
        const temporada = btn.getAttribute('data-temporada') || '';
        const selo = btn.getAttribute('data-selo') || '';

        document.getElementById('editId').value = id;
        document.getElementById('editNome').value = nome;
        document.getElementById('editPreco').value = preco;
        document.getElementById('editModelo').value = modelo;
        document.getElementById('editCategoria').value = categoria;
        document.getElementById('editSelo').value = selo;

        atualizarTemporadasETimesEdit(temporada);

        document.getElementById('editTime').value = time;
        document.getElementById('modalEdicao').classList.remove('hidden');
    }

    function fecharModalEdicao() {
        document.getElementById('modalEdicao').classList.add('hidden');
    }
</script>

</body>
</html>
